  <!-- Zámek dashboardu. Přihlášení řeší web — jedno, s rozcestníkem firma/
       brigádník. Nepřihlášený se tu jen krátce zastaví, než ho JS pošle tam. -->
  <div id="auth-gate" class="nahr-plocha" role="status">
    <div class="nahr-obsah">
      <canvas id="gate-orb" aria-hidden="true"></canvas>
      <p class="nahr-text" id="gate-msg">Nahráváme vaše údaje</p>
    </div>
  </div>
  <!-- Orb (thinking-orbs, MIT) bez Reactu — viz /vendor/thinking-orbs/orb.js.
       Když se nenačte, zůstanou aspoň tečky za textem. -->
  <script>
    // Okamžik kliknutí na „Přihlásit se" (web ho uložil) — modrá od něj drží
    // nejméně 5 s. Kdo sem přijde přímo, tomu se počítá od otevření stránky.
    window.__nahrOd = (function () {
      try {
        const u = Number(sessionStorage.getItem('makej-nahr-od'));
        if (u && Date.now() - u < 20000) return u;
      } catch (e) {}
      return Date.now();
    })();
  </script>
  <!-- blocking="render": stránka se ukáže až s nakresleným orbem (první
       snímek se kreslí hned při spuštění), takže orb naskočí spolu s textem
       a nedopadne později. Do té doby prohlížeč drží modrou z webu. -->
  <script type="module" async blocking="render">
    import { spustOrb } from '/vendor/thinking-orbs/orb.js?v=3';
    window.__zastavOrb = spustOrb(document.getElementById('gate-orb'), { state: 'connecting', size: 64 });
  </script>

  <div id="root"></div>

  <!-- Velké skripty až TADY, ne v <head>. Dokud je prohlížeč nestáhne
       a nespustí (Babel má 3 MB), nesmí nic vykreslit — po přihlášení se
       proto na vteřinu zasekl poslední obraz webu a pak stránka „problikla".
       Modrá obrazovka výš se teď vykreslí dřív, než se na ně začne čekat. -->
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

  <script>
    // ── Auth gate ──
    const SUPABASE_URL = 'https://cxegfwfbgcgpwerfbvra.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_N_BIwMCTD6ZOTrtBl3juyw_CGIQ_lvh';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, storageKey: 'makej-auth' }
    });

    const gate = document.getElementById('auth-gate');
    const gateMsg = document.getElementById('gate-msg');
    // Modrá odejde, až je dashboard OPRAVDU vykreslený — ne ve chvíli, kdy se
    // ověří přihlášení. Mezi tím se v prohlížeči ještě 2–4 s překládá 12
    // souborů JSX; dřív se zámek schoval hned a člověk koukal na prázdnou
    // tmavou plochu, která vypadala jako rozbitá stránka.
    function hideGate() {
      const root = document.getElementById('root');
      let pojistka = 0;
      // Modrá svítí nejméně 5 s od kliknutí na „Přihlásit se" (web to uloží do
      // sessionStorage), bez ohledu na rychlost počítače. Dashboard se totiž
      // vykreslí dřív, než do něj dotečou data z databáze — delší modrá to
      // schová a dashboard naskočí rovnou naplněný. Kdo sem přijde přímo
      // (záložka, obnovení), tomu se to počítá od otevření stránky.
      const MIN_MODRA = 5000;
      // window.__nahrOd nastavil skript hned pod zámkem: čerstvý čas kliknutí
      // z webu, jinak otevření stránky. Záznam se nemaže — čte ho i orb a
      // pořadí obou skriptů není zaručené; starý záznam odfiltruje 20s limit.
      const od = window.__nahrOd || performance.timeOrigin || Date.now();
      const hotovo = () => {
        clearTimeout(pojistka);
        const zbyva = Math.max(0, od + MIN_MODRA - Date.now());
        setTimeout(odejdi, zbyva);
      };
      const odejdi = () => {
        // Snímek navíc, ať se dashboard stihne pod modrou vykreslit celý.
        requestAnimationFrame(() => requestAnimationFrame(() => {
          gate.classList.add('odchazi');
          root.classList.add('nahr-dovnitr');
          setTimeout(() => {
            gate.classList.add('hidden');
            if (window.__zastavOrb) window.__zastavOrb();
          }, 650);
        }));
      };
      if (root.childElementCount) return hotovo();
      const hlidac = new MutationObserver(() => {
        if (root.childElementCount) { hlidac.disconnect(); hotovo(); }
      });
      hlidac.observe(root, { childList: true });
      // Kdyby se dashboard nevykreslil vůbec (spadlý skript, výpadek sítě),
      // nenechat člověka navždy na modré — říct to a nabídnout znovu.
      pojistka = setTimeout(() => {
        if (root.childElementCount) return;
        gateMsg.textContent = 'Načítání trvá déle, než by mělo.';
        const obsah = gate.querySelector('.nahr-obsah');
        const p = document.createElement('p'); p.className = 'nahr-chyba';
        p.textContent = 'Zkontrolujte připojení a zkuste to znovu.';
        const b = document.createElement('button'); b.className = 'nahr-znovu'; b.type = 'button';
        b.textContent = 'Zkusit znovu'; b.onclick = () => location.reload();
        obsah.append(p, b);
      }, 25000);
    }

    // Přihlášení má na starost web — jedno, s rozcestníkem firma/brigádník.
    // Přihlášená firma jde rovnou do dashboardu; kdokoli jiný (nepřihlášený
    // nebo brigádník) se pošle na to webové přihlášení s předvybranou rolí.
    sb.auth.getSession().then(({ data: { session } }) => {
      const role = session?.user?.user_metadata?.role;
      if (session && role === 'employer') {
        hideGate();
        return;
      }
      if (session && role !== 'employer') {
        // Přihlášený brigádník na adrese dashboardu → jasná hláška, pak pryč
        gateMsg.textContent = 'Tento dashboard je jen pro zaměstnavatele. Přesměrování…';
      } else {
        gateMsg.textContent = 'Přesměrování na přihlášení…';
      }
      window.location.replace('/?login=employer');
    });
  </script>
