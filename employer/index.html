<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Makej! — dashboard pro zaměstnavatele</title>
  <link rel="icon" type="image/png" href="/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">

  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; }
    html, body {
      margin: 0; padding: 0;
      background: #07071a;
      font-family: "Inter", -apple-system, system-ui, sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    iconify-icon { display: inline-flex; line-height: 0; }
    @keyframes empSpin { to { transform: rotate(360deg); } }
    @keyframes empPop { 0% { transform: scale(0.92) translateY(12px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
    @keyframes onlinePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); } 50% { box-shadow: 0 0 0 5px rgba(34,197,94,0); } }
    @keyframes empPillIn { 0% { transform: translate(-50%, 26px); opacity: 0; } 100% { transform: translate(-50%, 0); opacity: 1; } }
    @keyframes empPillPop { 0% { transform: translate(-50%,0) scale(1); opacity: 1; } 25% { transform: translate(-50%,0) scale(0.9); opacity: 1; } 60% { transform: translate(-50%,0) scale(1.35); opacity: 1; } 100% { transform: translate(-50%,0) scale(1.8); opacity: 0; } }
    @keyframes empCheckIn { 0% { transform: scale(0.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes empArrowFly { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-28px); opacity: 0; } }
    @keyframes empUpBob { 0% { transform: translateY(4px); opacity: 0; } 28% { transform: translateY(0); opacity: 1; } 72% { transform: translateY(-3px); opacity: 1; } 100% { transform: translateY(-7px); opacity: 0; } }
    @keyframes empRingFill {
      0%   { stroke-dashoffset: 100.53; }
      15%  { stroke-dashoffset: 75; }    /* rychlejší rozjezd */
      30%  { stroke-dashoffset: 68; }    /* zpomalí kolem třetiny */
      45%  { stroke-dashoffset: 58; }    /* mírně dál */
      55%  { stroke-dashoffset: 42; }    /* zrychlí za půlku */
      70%  { stroke-dashoffset: 36; }    /* zase zpomalí */
      85%  { stroke-dashoffset: 20; }    /* zrychlí */
      100% { stroke-dashoffset: 0; }     /* dojede */
    }

    /* Auth gate */
    #auth-gate {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      /* Modrý brandový nádech shora do skoro černé navy — místo fialové */
      background: radial-gradient(130% 90% at 50% -10%, #0a1e8a 0%, #060a24 55%, #05071a 100%);
      z-index: 9999;
    }
    #auth-gate.hidden { display: none; }
    .gate-card {
      background: #0a0d2e;
      border: 1px solid #1a2050;
      border-radius: 1.5rem;
      padding: 2.5rem;
      width: min(420px, calc(100vw - 40px));
      text-align: center;
      box-shadow: 0 30px 70px rgba(0,10,60,0.5);
    }
    .gate-logo {
      font-family: Inter, sans-serif;
      font-size: 2.2rem; font-weight: 900;
      color: #ffffff; letter-spacing: -0.5px;
      margin-bottom: 1.75rem;
    }
    .gate-logo b { color: #4d63ff; font-weight: 900; }
    .gate-desc { color: #8a90b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .gate-spin {
      width: 26px; height: 26px; margin: 0 auto;
      border-radius: 999px;
      border: 3px solid #1e2557; border-top-color: #0020f6;
      animation: empSpin .7s linear infinite;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(208,208,255,0.12); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(208,208,255,0.22); }

    button { font-family: inherit; }
    input { font-family: inherit; }

    /* Celý dashboard — font Inter (přebíjí inline League Spartan ze sdílených tokenů T.font*) */
    #root, #root * { font-family: "Inter", -apple-system, system-ui, sans-serif !important; }
  </style>
</head>
<body>

  <!-- Zámek dashboardu. Přihlášení řeší web — jedno, s rozcestníkem firma/
       brigádník. Nepřihlášený se tu jen krátce zastaví, než ho JS pošle tam. -->
  <div id="auth-gate">
    <div class="gate-card">
      <div class="gate-logo">makej<b>!</b></div>
      <div class="gate-desc" id="gate-msg">Přesměrování na přihlášení…</div>
      <div class="gate-spin"></div>
    </div>
  </div>

  <div id="root"></div>

  <script>
    // ── Auth gate ──
    const SUPABASE_URL = 'https://cxegfwfbgcgpwerfbvra.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_N_BIwMCTD6ZOTrtBl3juyw_CGIQ_lvh';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, storageKey: 'makej-auth' }
    });

    const gate = document.getElementById('auth-gate');
    const gateMsg = document.getElementById('gate-msg');
    function hideGate() { gate.classList.add('hidden'); }

    // Přihlášení má na starost web — jedno, s rozcestníkem firma/brigádník.
    // Přihlášená firma jde rovnou do dashboardu; kdokoli jiný (nepřihlášený
    // nebo brigádník) se pošle na to webové přihlášení s předvybranou rolí.
    sb.auth.getSession().then(({ data: { session } }) => {
      const role = session?.user?.user_metadata?.role;
      if (session && role === 'employer') {
        hideGate();
        return;
      }
      if (session && role !== 'employer') {
        // Přihlášený brigádník na adrese dashboardu → jasná hláška, pak pryč
        gateMsg.textContent = 'Tento dashboard je jen pro zaměstnavatele. Přesměrování…';
      }
      window.location.replace('/?login=employer');
    });
  </script>

  <script type="text/babel" src="app.jsx?v=3"></script>
  <script type="text/babel" src="employer-data.jsx?v=2"></script>
  <script type="text/babel" src="employer-shell.jsx?v=24"></script>
  <script type="text/babel" src="employer-dashboard.jsx?v=15"></script>
  <script type="text/babel" src="employer-pages.jsx?v=72"></script>
  <script type="text/babel" src="employer-pages3.jsx?v=28"></script>
  <script type="text/babel" src="_premium/kraje-map.jsx?v=19"></script>
  <script type="text/babel" src="_premium/analytics.jsx?v=24"></script>
  <script type="text/babel" src="employer-supabase.jsx?v=5"></script>
  <script type="text/babel" src="employer-main.jsx?v=22"></script>
</body>
</html>
